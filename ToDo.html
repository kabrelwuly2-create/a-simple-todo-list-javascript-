<!DOCTYPE html>
<html>
    <head>
        <title>Todolist</title>
        <meta charset="utf-8">
        <link type="text/css" href="ToDo.css" rel="stylesheet" >
    </head>
    <body>
        <h1>Liste de mes tâches</h1>
        <table>
            <thead>
                <tr>
                    <th>Tâches</th>
                    <th>Statut</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <h2>Creer et ajouter une tâche</h2>

        <form id="newTache">
            <label for="titleTache">Titre</label>
            <input type="text" id="titleTache" name="titleTache" placeholder="entrez le titre de votre tâche"><br>
            <button type="submit">Ajouter</button>

        </form>

        <script src="Todo.js"></script>
    </body>

</html>
